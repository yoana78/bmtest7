      (function () {
        try {
          if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          var h = document.documentElement;
          if (!sessionStorage.getItem("bm-intro")) h.classList.add("mx-intro");
          else if (sessionStorage.getItem("bm-transit")) h.classList.add("mx-enter");
          // 스크립트가 로드되지 않아도 화면이 가려진 채 남지 않게 하는 안전장치
          setTimeout(function () { h.classList.remove("mx-intro", "mx-enter"); }, 6000);
        } catch (e) {}
      })();
